type: object

required:
  - event_id
  - event_name
  - location
  - start_date
  - end_date
  - created_at
  - updated_at

properties:
  event_id:
    type: string
    format: uuid

  event_name:
    type: string
    maxLength: 100

  description:
    type: string
    maxLength: 200

  location:
    type: string
    maxLength: 100

  start_date:
    type: string
    format: date-time

  end_date:
    type: string
    format: date-time

  created_at:
    type: string
    format: date-time
    readOnly: true

  updated_at:
    type: string
    format: date-time
    readOnly: true