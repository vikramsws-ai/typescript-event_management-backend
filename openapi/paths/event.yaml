event:
  get:
    summary: Get all events
    operationId: getAllEvents
    responses:
      '200':
        description: Events retrieved successfully
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/event.yaml#/event'

  post:
    summary: Create an event
    operationId: createEvent
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/event.yaml#/CreateEventRequest'

    responses:
      '200':
        description: Event created successfully
        content:
          application/json:
            schema:
              $ref: '../schemas/event.yaml#/event'